  ApplicationOverview:  
    Purpose: >  
      The RPA platform provides Robotic Process Automation (RPA) capabilities to Citi business users. RPA developers use the platform (Automation Anywhere) to develop and test bots. These bots automate business use cases in production across three regional environments (NAM, APAC, EMEA) for global Citi internal users. It helps automate processes and remediate end-user computing tasks.  
    Industry: Financial Services (Banking)  

  TechnicalArchitecture:  
    ArchitectureType: >  
      Automation Anywhere (vendor product) installed on Windows server. The ecosystem development components are built using microservices architecture.  
    TechnologyStack:  
      Frontend: Not explicitly mentioned in provided document.  
      Backend: Java using Spring Boot.  
      Database: MS SQL Server (Control Room Database and Ecosystem Database)  
      VendorSoftware: Automation Anywhere installed on Windows Server.  
    Deployment: On-premises Windows Server 2019, SQL Server 2019.  
    Components:  
      ControlCentral: >  
        Java Spring Boot service, provides bot runner VDI screen stream to the RPA bot user and command to execute tasks in VDI (e.g., reboot VDI, restart specific services, extract logs or files and send via email).  
      RDPService: Builds RDP connection to bot runner VDI in the backend server.  
      CredentialService: Retrieves passwords from CyberArk (internal password management).  
      AuthenticationService: Provides Single Sign-On (SSO) for Control Central login.  
      STEDataService: Allows applications and other services to access the database.  

  DataFlowsAndIntegrations:  
    DataMovement:  
      EcosystemDatabase:  
        Purpose: To be defined  
        DataStored: To be defined  
        TablesSchemas: To be defined  
        DataMovementWithEcosystem: To be defined  
      ControlRoomDatabase:  
        Purpose: >  
          Central to the Automation Anywhere platform. It stores configuration data, bot metadata, scheduling information, user credentials, audit logs, and runtime information.  
        DataStored:  
          - Bot definitions (workflows, tasks, scripts)  
          - User accounts and roles  
          - Schedules for bot execution  
          - Runtime logs (execution status, errors, warnings)  
          - Configuration settings for the Control Room and its components  
          - Credentials (encrypted) for accessing systems and applications  
          - Audit logs (user actions, system events)  
        TablesSchemas:  
          - Bots  
          - Users  
          - Schedules  
          - Devices (Bot Runners)  
          - Credentials  
          - Logs  
          - Settings  
        DataMovementWithAutomationAnywhere:  
          BotDevelopment:  
            - Developers create bots within the Automation Anywhere development environment (part of the Control Room).  
            - Bot definitions and metadata are stored in the Control Room Database.  
          BotDeploymentAndScheduling:  
            - Bots are deployed to Bot Runners (devices that execute the bots).  
            - Scheduling information is stored in the Control Room Database.  
            - At runtime, the Control Room instructs Bot Runners to execute specific bots based on the schedule.  
          BotExecution:  
            - Bot Runners retrieve bot definitions and credentials from the Control Room Database.  
            - Bots interact with various systems (applications, databases, APIs) to automate tasks.  
          DataInteractionDuringBotExecution:  
            - Bots read data from and write data to applications, databases, and files.  
            - Bots may interact with the Credential Service to fetch passwords from CyberArk.  
            - Bots may use the STEData Service to read from or write to the Ecosystem Database.  
          LoggingAndMonitoring:  
            - Bot Runners send execution logs (status, errors, warnings) back to the Control Room.  
            - The Control Room stores these logs in the Control Room Database.  
            - Monitoring dashboards display data retrieved from the Control Room Database.  
    DataFlowDiagram: To be provided  
