  UserRolesAndPermissions:  
    UserRoles:  
      - Developers  
      - Testers  
      - Business Users  
    Permissions:  
      - Role-based access control for bot creation, modification, and execution.  
      - Access levels are based on the principle of least privilege.  
      - Credential Management: Secure storage and management of credentials.  

  MonitoringAndLogging:  
    Tools:  
      - ITRS Samler  
      - ITRStrigger PowerShell Script to monitor Server and VDI  
    Logs:  
      - Control Room Logs stored in Application server  
      - Ecosystem Logs stored in Application server  
      - Bot Runner Logs and VDI Logs stored in VDIs  

  Infrastructure:  
    Setup:  
      - 3 Windows servers as application servers build cluster node for Control Room  
      - 2 Windows servers as application servers build cluster for Ecosystem application  
      - 2 MS SQL Databases adopt Always On configuration  
      - Network configurations adopt Citi internal network configuration.  
    Capacity:  
      ApplicationServers:  
        Memory: 32 GB  
        CPU: 8  

  SecurityConfigurations:  
    Measures:  
      - ControlRoomAccess: Role-based access control, AD Password for user login.  
      - ControlCentralAccess: Role-based access control, inherits from Control Room roles, Single Sign-On (SSO) for user login.  

  BusinessProcesses:  
    InteractionWithControlRoom:  
      UserLogin: User logs in to Control Room with enterprise AD password.  
      BotDevelopmentAndTesting:  
        BotCreation: Use bot creator tool to develop bot.  
        BotExportImport: Export & Import developed bot to package from Dev for promotion to UAT or Production.  
        BotScheduling: >  
          Through the Control Room, Emily schedules the bot to run every morning at 7:00 AM to process onboarding tasks received the previous day.  
    InteractionWithControlCentral:  
      Overview: >  
        Control Central provides a secure and centralized platform for authorized users (e.g., RPA Admins, IT Analysts) to log in and manage Bot Runner VDIs.  
      Process:  
        - The user accesses the Control Central interface via a web browser or designated client software.  
        - The user logs in using corporate credentials, verified through the Single Sign-On (SSO) feature provided by the Authentication Service.  
        - Tasks performed in Control Central:  
          - View Bot Runner VDI to monitor ongoing running bots.  
          - Send commands to VDI for maintenance:  
            - Reboot VDI  
            - Restart bot runner agent  
            - Export logs  

